name: CCPun SEO Category Hubs CI

on:
  pull_request:
    branches: [v4-production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ccpun-seo-category-hubs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit --incremental false

      - name: Existing Vercel and analytics regressions
        run: npm run test:vercel

      - name: Admin and SEO hub regressions
        run: npm run test:admin

      - name: Production-parity build on non-production data plane
        run: npm run build
        env:
          CCPUN_APP_ENV: development
          NEXT_PUBLIC_CCPUN_APP_ENV: development
          NEXT_PUBLIC_SANITY_PROJECT_ID: ccb9lnw5
          NEXT_PUBLIC_SANITY_DATASET: uat
