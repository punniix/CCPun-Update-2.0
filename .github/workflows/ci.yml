name: CCPun CI

on:
  pull_request:
    branches: [uat, v4-production]
  push:
    branches: [uat]

permissions:
  contents: read

concurrency:
  group: ccpun-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit --incremental false

      - name: Vercel and analytics regression
        run: npm run test:vercel

      - name: Admin policy regression
        run: npm run test:admin

      - name: Insurance taxonomy V2 self-test
        run: npm run cms:taxonomy:v2:self-test

      - name: Backup automation regression
        run: node tests/backup-regression.mjs

      - name: Analytics archive regression
        run: node tests/analytics-archive-regression.mjs

      - name: Production-parity build on non-production data plane
        run: npm run build
        env:
          CCPUN_APP_ENV: development
          NEXT_PUBLIC_CCPUN_APP_ENV: development
          NEXT_PUBLIC_SANITY_PROJECT_ID: ccb9lnw5
          NEXT_PUBLIC_SANITY_DATASET: uat
