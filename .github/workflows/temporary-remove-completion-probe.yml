name: Temporary remove architecture completion probe

on:
  push:
    branches:
      - refactor/repository-architecture-v42-20260828
    paths:
      - .github/workflows/temporary-remove-completion-probe.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/repository-architecture-v42-20260828
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Remove probe and this workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch docs/architecture/.completion-probe
          git rm -f --ignore-unmatch .github/workflows/temporary-remove-completion-probe.yml
      - name: Verify permanent architecture contract
        shell: bash
        run: |
          set -euo pipefail
          test -d app
          test -d features
          test -d core
          test -d shared
          test ! -d components
          test ! -d lib
          test ! -d hooks
          test -f docs/architecture/repository-architecture.md
          test -f docs/architecture/repository-architecture-verification-2026-08-28.md
      - name: Run architecture guard
        run: |
          npm ci
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.['check:repository-architecture'] ? 0 : 1)"; then
            npm run check:repository-architecture
          else
            npm run check:architecture
          fi
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CCPun Architecture Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary architecture verification transport"
          git push origin HEAD:refactor/repository-architecture-v42-20260828
